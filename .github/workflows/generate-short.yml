name: Generuj film Faktoryia

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-short.yml"
      - "src/**"
      - "data/facts.json"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      episode_id:
        description: "ID ciekawostki (puste = losowa)"
        required: false
        type: string
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: read

jobs:
  generate:
    name: Renderuj dwuminutowy odcinek What If
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7
      - name: Przygotuj Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Zainstaluj FFmpeg i czcionki
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Zainstaluj biblioteki
        run: python -m pip install -r requirements.txt
      - name: Pobierz polski głos neuronowy Piper
        run: |
          mkdir -p voices
          python -m piper.download_voices --download-dir voices pl_PL-darkman-medium
      - name: Wygeneruj animowany film
        env:
          FACT_ID: ${{ github.event.inputs.episode_id }}
        run: |
          if [ -n "$FACT_ID" ]; then
            python src/generate.py --episode-id "$FACT_ID"
          else
            python src/generate.py
          fi
      - name: Zapisz gotowy film i opis
        uses: actions/upload-artifact@v7
        with:
          name: faktoryia-what-if-odcinek
          path: output/
          if-no-files-found: error
          retention-days: 7
